plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.minecraft_version}-${project.mod_version}"
group = project.mod_group_id

base {
	archivesName = project.mod_id
}

repositories {
	maven { url = 'https://maven.fabricmc.net/' }
	// Modrinth maven hosts the Fabric ports of Sophisticated Core / Sophisticated Backpacks.
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Required mods (Fabric ports), addressed by Modrinth project id: Sophisticated Backpacks / Sophisticated Core
	modImplementation "maven.modrinth:ouNrBQtq:${project.sophisticated_backpacks_version}"
	modImplementation "maven.modrinth:9jxwkYQL:${project.sophisticated_core_version}"
	// Needed by Sophisticated Core at runtime
	modImplementation "maven.modrinth:forge-config-api-port:${project.forge_config_api_port_version}"

	// Needed by Sophisticated Core at runtime
	modImplementation "teamreborn:energy:${project.energy_version}"

	testImplementation 'junit:junit:4.13.2'
}

processResources {
	def props = [
		version             : project.mod_version,
		mod_id              : project.mod_id,
		mod_name            : project.mod_name,
		mod_description     : project.mod_description,
		mod_license         : project.mod_license,
		mod_authors         : project.mod_authors,
		minecraft_version   : project.minecraft_version,
		loader_version      : project.loader_version
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

test {
	useJUnit()
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def modId = project.mod_id
	from("LICENSE") {
		rename { "${it}_${modId}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
